# Pushes the database schema (supabase/migrations) and Edge Functions
# (supabase/functions) to your Supabase project on every push to main.
#
# One-time setup — add these as repo Secrets (Settings → Secrets and variables →
# Actions → Secrets → New repository secret):
#   SUPABASE_ACCESS_TOKEN   supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF    Project Settings → General → Reference ID
#   SUPABASE_DB_PASSWORD    the database password you set when creating the project
#                            (Project Settings → Database → Reset database password
#                            if you don't remember it)
#   AI_API_KEY               your AI provider key
#   AI_MODEL                 e.g. gemini-2.5-flash
#   AI_BASE_URL               e.g. https://generativelanguage.googleapis.com/v1beta/openai
#
# See github-pages/README.md for the full walkthrough.
name: Deploy to Supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Push database schema
        run: supabase db push

      - name: Deploy Edge Functions
        run: supabase functions deploy

      - name: Set AI secrets
        run: |
          supabase secrets set \
            AI_API_KEY="${{ secrets.AI_API_KEY }}" \
            AI_MODEL="${{ secrets.AI_MODEL }}" \
            AI_BASE_URL="${{ secrets.AI_BASE_URL }}"
