# Builds the static version of Contextuary in github-pages/ and publishes it to
# GitHub Pages. One-time setup: Settings → Pages → Source: "GitHub Actions", and
# Settings → Secrets and variables → Actions → Variables: VITE_SUPABASE_URL and
# VITE_SUPABASE_PUBLISHABLE_KEY. See github-pages/README.md.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "github-pages/**"
      - ".github/workflows/deploy-github-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: github-pages/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # Project sites live at https://<user>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: github-pages/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # TEMPORARY — diagnosing a blank page report. Remove once resolved.
      - name: Smoke test the live page
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          echo "Checking $url"
          for i in $(seq 1 6); do
            body=$(curl -sS "$url" || true)
            if [ -n "$body" ]; then break; fi
            echo "empty response, retrying in 5s ($i/6)..."
            sleep 5
          done
          echo "----- index.html -----"
          echo "$body"
          script_path=$(echo "$body" | grep -oE 'src="[^"]*\.js"' | head -1 | sed -E 's/src="(.*)"/\1/')
          if [ -n "$script_path" ]; then
            case "$script_path" in
              /*) script_url="https://trieungocgiahan-rgb.github.io$script_path" ;;
              *) script_url="${url%/}/$script_path" ;;
            esac
            echo "----- fetching $script_url -----"
            js=$(curl -sS "$script_url" || true)
            echo "JS bundle size: ${#js} bytes"
            echo "----- grep for env values baked in -----"
            echo "$js" | grep -oE 'https://[a-z0-9-]+\.supabase\.co' | sort -u || echo "(no supabase.co URL found in bundle)"
            echo "$js" | grep -c "sb_publishable_" || echo "0 occurrences of sb_publishable_"
            echo "$js" | grep -oE 'Missing VITE_SUPABASE[^"]*' | head -1 || true
          else
            echo "No script tag found in index.html"
          fi
