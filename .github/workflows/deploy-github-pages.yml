# Builds the static version of Contextuary in github-pages/ and publishes it to
# GitHub Pages. One-time setup: Settings → Pages → Source: "GitHub Actions", and
# Settings → Secrets and variables → Actions → Variables: VITE_SUPABASE_URL and
# VITE_SUPABASE_PUBLISHABLE_KEY. See github-pages/README.md.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "github-pages/**"
      - ".github/workflows/deploy-github-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: github-pages/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # Project sites live at https://<user>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: github-pages/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # TEMPORARY — diagnosing a blank page report. The static build itself checked out
      # fine (correct HTML, JS bundle, baked-in env values); this actually runs it in a
      # browser against the real live site to catch a runtime error curl can't see.
      # Remove once resolved.
      - name: Set up Node for browser smoke test
        if: success()
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Browser smoke test the live page
        run: |
          mkdir -p /tmp/smoke && cd /tmp/smoke
          npm init -y >/dev/null 2>&1
          npm i -D playwright@1.56.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          node -e '
            const { chromium } = require("playwright");
            (async () => {
              const url = process.env.SITE_URL;
              const browser = await chromium.launch();
              const page = await browser.newPage();
              const errors = [];
              page.on("pageerror", (e) => errors.push("pageerror: " + e.message));
              page.on("console", (m) => { if (m.type() === "error") errors.push("console.error: " + m.text()); });
              page.on("requestfailed", (r) => errors.push("requestfailed: " + r.url() + " " + (r.failure()?.errorText || "")));
              try {
                await page.goto(url, { waitUntil: "networkidle", timeout: 30000 });
              } catch (e) {
                errors.push("goto failed: " + e.message);
              }
              await page.waitForTimeout(1500);
              const text = await page.locator("body").innerText().catch(() => "(could not read body text)");
              console.log("----- body text (first 800 chars) -----");
              console.log(JSON.stringify(text.slice(0, 800)));
              console.log("----- errors -----");
              console.log(errors.length ? JSON.stringify(errors, null, 2) : "(none)");
              await browser.close();
            })();
          '
        env:
          SITE_URL: https://trieungocgiahan-rgb.github.io/contextuary-sparkle/
